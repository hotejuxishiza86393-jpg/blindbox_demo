<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>搭子盲盒 · Demo 入口</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 1.5rem;
        font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
        background: linear-gradient(160deg, #fafafa 0%, #ececec 100%);
        color: #1a1a1a;
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 700;
      }
      .cards {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        width: 100%;
        max-width: 320px;
      }
      a.card {
        display: block;
        padding: 1rem 1.25rem;
        border-radius: 14px;
        text-decoration: none;
        color: inherit;
        border: 1px solid rgba(0, 0, 0, 0.08);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      a.card:active {
        transform: scale(0.98);
      }
      a.card--main {
        background: linear-gradient(135deg, #fff9e6 0%, #feee40 45%, #ffd600 100%);
        font-weight: 600;
      }
      a.card--sub {
        background: #fff;
      }
      a.card .sub {
        display: block;
        margin-top: 0.35rem;
        font-size: 0.8rem;
        font-weight: 400;
        color: #666;
      }
    </style>
  </head>
  <body>
    <h1>搭子盲盒 Demo</h1>
    <div class="cards">
      <a class="card card--main" href="blindbox-demo.html">
        完整交互 Demo
        <span class="sub">入口、匹配、私聊、记录等流程</span>
      </a>
      <a class="card card--sub" href="blindbox-open-effect.html">
        开启动效组件（纯 CSS）
        <span class="sub">立体盲盒 + 蓄力 / 弹出 / 粒子 / 底座，单页自包含</span>
      </a>
    </div>
  </body>
</html>
