<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>搭子盲盒 · 开启动效（纯 CSS）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bb: {
                main: "#FEEE40",
                sub: "#FFB84D",
                lid: "#FFC107",
                body: "#FFF9E6",
                side: "#E89428",
                q: "#333333",
              },
            },
          },
        },
      };
    </script>
    <style>
      :root {
        --bb-main: #feee40;
        --bb-sub: #ffb84d;
        --bb-lid: #ffc107;
        --bb-body: #fff9e6;
        --bb-side: #f0a030;
        --bb-q: #333333;
        --bb-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        --bb-shadow-charge: 0 12px 40px rgba(0, 0, 0, 0.18);
        --ease: cubic-bezier(0.4, 0, 0.2, 1);
      }

      * {
        box-sizing: border-box;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* ========== 舞台透视 ========== */
      .bb-stage {
        perspective: 900px;
        perspective-origin: 50% 40%;
      }

      .bb-preserve {
        transform-style: preserve-3d;
      }

      /* 匹配中：整舞台轻微震动（1.5s–2.2s） */
      @keyframes bb-shake {
        0%,
        100% {
          transform: translateX(0);
        }
        12% {
          transform: translateX(-4px);
        }
        25% {
          transform: translateX(4px);
        }
        37% {
          transform: translateX(-4px);
        }
        50% {
          transform: translateX(4px);
        }
        62%,
        100% {
          transform: translateX(0);
        }
      }

      #bb-play:checked ~ .bb-stage .bb-shake-layer {
        animation: bb-shake 0.7s 1.5s var(--ease) forwards;
      }

      /* ========== 底座 ========== */
      .bb-base {
        width: 200px;
        height: 20px;
        margin: 0 auto;
        border-radius: 999px;
        background: linear-gradient(180deg, rgba(254, 238, 64, 0.55), rgba(254, 238, 64, 0.22));
        box-shadow:
          0 0 20px rgba(254, 238, 64, 0.5),
          0 6px 16px rgba(0, 0, 0, 0.08);
        transform: translateY(0);
      }

      @keyframes bb-base-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }

      @keyframes bb-base-glow-pulse {
        0%,
        100% {
          box-shadow:
            0 0 20px rgba(254, 238, 64, 0.5),
            0 6px 16px rgba(0, 0, 0, 0.08);
          transform: translateY(0) scale(1);
        }
        33% {
          box-shadow:
            0 0 36px rgba(254, 238, 64, 0.85),
            0 8px 20px rgba(0, 0, 0, 0.1);
          transform: translateY(0) scale(1.06);
        }
        66% {
          box-shadow:
            0 0 28px rgba(255, 184, 77, 0.65),
            0 6px 16px rgba(0, 0, 0, 0.08);
          transform: translateY(0) scale(1.02);
        }
      }

      #bb-play:not(:checked) ~ .bb-stage .bb-base {
        animation: bb-base-float 3s ease-in-out infinite;
        animation-delay: 0.3s;
      }

      #bb-play:checked ~ .bb-stage .bb-base {
        animation-name: bb-base-float, bb-base-glow-pulse;
        animation-duration: 3s, 0.5s;
        animation-timing-function: ease-in-out, ease-in-out;
        animation-iteration-count: infinite, 3;
        animation-delay: 0.3s, 0s;
      }

      /* ========== 盲盒整体上下浮动（未播放时） ========== */
      @keyframes bb-box-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      #bb-play:not(:checked) ~ .bb-stage .bb-box-float {
        animation: bb-box-float 3s ease-in-out infinite;
      }

      #bb-play:checked ~ .bb-stage .bb-box-float {
        animation: bb-box-float 3s ease-in-out infinite, bb-charge-float 1.5s ease-in-out forwards;
      }

      /* 蓄力阶段与浮动叠加：用 wrapper 分层，蓄力只作用在 scale 层 */
      @keyframes bb-charge-float {
        0%,
        100% {
          transform: translateY(0);
        }
        16.66% {
          transform: translateY(-4px);
        }
        33.33% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-4px);
        }
        66.66% {
          transform: translateY(0);
        }
        83.33% {
          transform: translateY(-4px);
        }
        100% {
          transform: translateY(0);
        }
      }

      .bb-scale-layer {
        transform-origin: center bottom;
      }

      @keyframes bb-charge-scale {
        0%,
        100% {
          transform: scale(1);
        }
        16.66% {
          transform: scale(1.2);
        }
        33.33% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.2);
        }
        66.66% {
          transform: scale(1);
        }
        83.33% {
          transform: scale(1.2);
        }
        100% {
          transform: scale(1);
        }
      }

      #bb-play:checked ~ .bb-stage .bb-scale-layer {
        animation: bb-charge-scale 1.5s ease-in-out forwards;
      }

      /* 阴影蓄力 */
      .bb-lit-shadow {
        filter: drop-shadow(var(--bb-shadow));
      }

      @keyframes bb-shadow-charge {
        0%,
        100% {
          filter: drop-shadow(0 8px 32px rgba(0, 0, 0, 0.12));
        }
        16.66%,
        50%,
        83.33% {
          filter: drop-shadow(0 12px 40px rgba(0, 0, 0, 0.18));
        }
        33.33%,
        66.66%,
        100% {
          filter: drop-shadow(0 8px 32px rgba(0, 0, 0, 0.12));
        }
      }

      #bb-play:checked ~ .bb-stage .bb-lit-shadow {
        animation: bb-shadow-charge 1.5s ease-in-out forwards;
      }

      /* ========== 立体盲盒：盒身 + 盒盖 ========== */
      .bb-cuboid {
        position: relative;
        width: 180px;
        height: 200px;
        margin: 0 auto;
        transform-style: preserve-3d;
        transform: rotateX(-18deg) rotateY(-28deg);
      }

      .bb-body-sink {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
      }
      .bb-body-front {
        position: absolute;
        inset: 0;
        width: 180px;
        height: 200px;
        background: var(--bb-body);
        border-radius: 12px;
        border: 1px solid rgba(0, 0, 0, 0.06);
        transform: translateZ(28px);
        display: flex;
        align-items: center;
        justify-content: center;
        backface-visibility: hidden;
      }

      .bb-body-front .bb-qmark {
        font-family: ui-rounded, "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", system-ui, sans-serif;
        font-size: 112px;
        font-weight: 800;
        line-height: 1;
        color: var(--bb-q);
        letter-spacing: -0.06em;
        user-select: none;
        text-shadow: 0 2px 0 rgba(255, 255, 255, 0.5);
      }

      .bb-body-right {
        position: absolute;
        width: 56px;
        height: 200px;
        left: 180px;
        top: 0;
        background: linear-gradient(90deg, #d88820, var(--bb-side));
        border-radius: 0 10px 10px 0;
        transform-origin: left center;
        transform: rotateY(90deg) translateZ(28px);
        border: 1px solid rgba(0, 0, 0, 0.08);
        backface-visibility: hidden;
      }

      .bb-body-top {
        position: absolute;
        width: 180px;
        height: 56px;
        left: 0;
        top: 0;
        background: linear-gradient(180deg, #fffef0, #ffe9a8);
        border-radius: 12px 12px 4px 4px;
        transform-origin: bottom center;
        transform: rotateX(90deg) translateZ(200px);
        border: 1px solid rgba(0, 0, 0, 0.05);
        backface-visibility: hidden;
      }

      /* 盒盖组：盖在盒身上方，可整体飞出 */
      .bb-lid-wrap {
        position: absolute;
        left: -6px;
        top: -38px;
        width: 192px;
        height: 72px;
        transform-style: preserve-3d;
        transform: translateZ(62px) translateY(0);
        transform-origin: 50% 100%;
        z-index: 10;
      }

      @keyframes bb-lid-wobble {
        0%,
        100% {
          transform: translateZ(62px) rotateZ(0deg);
        }
        25% {
          transform: translateZ(62px) rotateZ(1.5deg);
        }
        50% {
          transform: translateZ(62px) rotateZ(0deg);
        }
        75% {
          transform: translateZ(62px) rotateZ(-1.5deg);
        }
      }

      #bb-play:not(:checked) ~ .bb-stage .bb-lid-wrap {
        animation: bb-lid-wobble 2.5s ease-in-out infinite;
      }

      #bb-play:checked ~ .bb-stage .bb-lid-wrap {
        animation: bb-lid-fly 0.7s 1.5s cubic-bezier(0.32, 0.72, 0, 1) forwards;
      }

      @keyframes bb-lid-fly {
        from {
          transform: translateZ(62px) translateY(0) rotateZ(0deg);
          opacity: 1;
        }
        to {
          transform: translateZ(120px) translateY(-120px) rotateZ(-15deg);
          opacity: 0.6;
        }
      }

      .bb-lid-top {
        position: absolute;
        left: 8px;
        top: 0;
        width: 176px;
        height: 52px;
        background: linear-gradient(145deg, #fff6a0 0%, var(--bb-main) 38%, var(--bb-lid) 100%);
        border-radius: 12px 12px 8px 8px;
        box-shadow:
          inset 0 2px 0 rgba(255, 255, 255, 0.65),
          inset 0 -6px 12px rgba(0, 0, 0, 0.06);
        transform: rotateX(12deg);
        transform-origin: bottom center;
      }

      .bb-lid-front {
        position: absolute;
        left: 10px;
        top: 44px;
        width: 172px;
        height: 22px;
        background: linear-gradient(180deg, var(--bb-lid), #e0a000);
        border-radius: 4px 4px 8px 8px;
        border: 1px solid rgba(0, 0, 0, 0.08);
      }

      .bb-lid-right {
        position: absolute;
        left: 174px;
        top: 8px;
        width: 22px;
        height: 48px;
        background: linear-gradient(90deg, #f5b020, #c97810);
        border-radius: 0 8px 6px 0;
        transform: skewY(-6deg);
        transform-origin: left top;
      }

      /* 提手：小立体块 */
      .bb-handle {
        position: absolute;
        left: 50%;
        top: 6px;
        width: 36px;
        height: 18px;
        margin-left: -18px;
        background: linear-gradient(180deg, #fff8a8, var(--bb-main));
        border-radius: 6px 6px 4px 4px;
        box-shadow:
          0 2px 0 rgba(0, 0, 0, 0.12),
          inset 0 1px 0 rgba(255, 255, 255, 0.7);
        transform: translateZ(4px);
      }

      .bb-handle::after {
        content: "";
        position: absolute;
        left: 4px;
        top: 100%;
        width: 28px;
        height: 8px;
        background: linear-gradient(180deg, #e8c400, var(--bb-lid));
        border-radius: 0 0 4px 4px;
      }

      #bb-play:checked ~ .bb-stage .bb-body-sink {
        animation: bb-body-sink 0.7s 1.5s cubic-bezier(0.32, 0.72, 0, 1) forwards;
      }

      @keyframes bb-body-sink {
        from {
          transform: translateY(0) scale(1);
        }
        to {
          transform: translateY(15px) scale(0.9);
        }
      }

      /* ========== 粒子 / 星星 ========== */
      .bb-burst {
        position: absolute;
        left: 50%;
        top: 42%;
        width: 4px;
        height: 4px;
        pointer-events: none;
        transform: translate(-50%, -50%);
        transform-style: preserve-3d;
      }

      .bb-particle {
        position: absolute;
        left: 0;
        top: 0;
        width: 14px;
        height: 14px;
        margin: -7px 0 0 -7px;
        border-radius: 2px;
        opacity: 0;
        transform: translate(0, 0) scale(0.2) rotate(0deg);
      }

      .bb-particle::before {
        content: "✦";
        display: block;
        font-size: 14px;
        line-height: 14px;
        text-align: center;
        color: inherit;
        text-shadow: 0 0 6px currentColor;
      }

      #bb-play:checked ~ .bb-stage .bb-particle {
        animation-name: bb-particle-fly;
        animation-duration: 0.6s;
        animation-timing-function: ease-out;
        animation-fill-mode: forwards;
      }

      .bb-particle:nth-child(1) {
        color: var(--bb-main);
        --tx: -56px;
        --ty: -48px;
        --rot: -140deg;
        animation-delay: 1.5s;
      }
      .bb-particle:nth-child(2) {
        color: var(--bb-sub);
        --tx: 52px;
        --ty: -44px;
        --rot: 120deg;
        animation-delay: 1.52s;
      }
      .bb-particle:nth-child(3) {
        color: #ffd54a;
        --tx: -36px;
        --ty: 40px;
        --rot: -60deg;
        animation-delay: 1.54s;
      }
      .bb-particle:nth-child(4) {
        color: var(--bb-main);
        --tx: 48px;
        --ty: 36px;
        --rot: 80deg;
        animation-delay: 1.5s;
      }
      .bb-particle:nth-child(5) {
        color: var(--bb-sub);
        --tx: 0;
        --ty: -64px;
        --rot: 180deg;
        animation-delay: 1.56s;
      }
      .bb-particle:nth-child(6) {
        color: #ffe082;
        --tx: -60px;
        --ty: 8px;
        --rot: 40deg;
        animation-delay: 1.58s;
      }

      @keyframes bb-particle-fly {
        0% {
          opacity: 0;
          transform: translate(0, 0) scale(0.3) rotate(0deg);
        }
        15% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(var(--tx), var(--ty)) scale(1.1) rotate(var(--rot));
        }
      }

      /* 亮光核 */
      .bb-flash-core {
        position: absolute;
        left: 50%;
        top: 44%;
        width: 8px;
        height: 8px;
        margin: -4px 0 0 -4px;
        border-radius: 50%;
        background: #fff;
        box-shadow:
          0 0 24px 12px rgba(254, 238, 64, 0.95),
          0 0 48px 20px rgba(255, 184, 77, 0.55);
        opacity: 0;
        pointer-events: none;
      }

      #bb-play:checked ~ .bb-stage .bb-flash-core {
        animation: bb-flash-pop 0.55s 1.5s ease-out forwards;
      }

      @keyframes bb-flash-pop {
        0% {
          opacity: 0;
          transform: scale(0.2);
        }
        30% {
          opacity: 1;
          transform: scale(4);
        }
        100% {
          opacity: 0;
          transform: scale(6);
        }
      }

      /* 控制条 */
      .bb-controls label {
        cursor: pointer;
        transition: transform 0.15s ease;
      }
      .bb-controls label:active {
        transform: scale(0.97);
      }

      #bb-play:checked ~ .bb-controls .bb-label-idle {
        display: none;
      }
      #bb-play:not(:checked) ~ .bb-controls .bb-label-busy {
        display: none;
      }
    </style>
  </head>
  <body class="min-h-screen bg-zinc-100 flex flex-col items-center justify-center gap-10 p-8">
    <div class="text-center space-y-1">
      <h1 class="text-xl font-bold text-zinc-800">搭子盲盒 · 开启动效</h1>
      <p class="text-sm text-zinc-500">纯 CSS + HTML；勾选下方开关播放匹配动效（取消勾选可重播）</p>
    </div>

    <input type="checkbox" id="bb-play" class="sr-only" />

    <div class="bb-stage w-full max-w-[320px] flex flex-col items-center gap-4">
      <div class="bb-shake-layer w-full flex flex-col items-center">
        <div class="relative w-[220px] h-[280px] flex flex-col items-center justify-end pb-2">
          <!-- 粒子与闪光在盒后层叠 -->
          <div class="bb-flash-core" aria-hidden="true"></div>
          <div class="bb-burst" aria-hidden="true">
            <span class="bb-particle"></span>
            <span class="bb-particle"></span>
            <span class="bb-particle"></span>
            <span class="bb-particle"></span>
            <span class="bb-particle"></span>
            <span class="bb-particle"></span>
          </div>

          <div class="bb-box-float bb-lit-shadow">
            <div class="bb-scale-layer bb-preserve">
              <div class="bb-preserve relative mx-auto" style="width: 180px; height: 200px">
                <div class="bb-cuboid">
                  <div class="bb-body-sink bb-preserve">
                    <div class="bb-body-front" aria-hidden="true">
                      <span class="bb-qmark">?</span>
                    </div>
                    <div class="bb-body-right" aria-hidden="true"></div>
                    <div class="bb-body-top" aria-hidden="true"></div>
                  </div>
                  <div class="bb-lid-wrap" aria-hidden="true">
                    <div class="bb-lid-top"></div>
                    <div class="bb-lid-right"></div>
                    <div class="bb-lid-front"></div>
                    <div class="bb-handle"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="bb-base mt-3" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <div class="bb-controls flex flex-wrap items-center justify-center gap-4 text-sm">
      <label
        for="bb-play"
        class="inline-flex items-center gap-2 rounded-full bg-bb-main px-5 py-2.5 font-semibold text-bb-q shadow-md ring-2 ring-black/5 hover:brightness-105"
      >
        <span class="bb-label-idle">开启匹配动效</span>
        <span class="bb-label-busy">动效进行中…</span>
      </label>
      <label
        for="bb-play"
        class="inline-flex items-center rounded-full border border-zinc-300 bg-white px-4 py-2 font-medium text-zinc-600 hover:bg-zinc-50"
      >
        取消勾选以重播
      </label>
    </div>

    <p class="max-w-md text-center text-xs text-zinc-400">
      入口态：盲盒与底座无限浮动，盒盖轻微摇摆。匹配态：0–1.5s 蓄力缩放与阴影闪烁；1.5–2.2s 盒盖上飞、盒身下沉、星光粒子与舞台震动。
    </p>
  </body>
</html>
